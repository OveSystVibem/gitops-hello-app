apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-hello-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-hello-app
  template:
    metadata:
      labels:
        app: gitops-hello-app
    spec:
      containers:
        - name: web
          image: vaz6/gitops-hello-app:v1
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
